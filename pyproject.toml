[project]
name = "options-tool"
version = "0.1.0"
description = "Local-first options trading assistant for IBKR — CC/CSP advisor with intent-based scoring"
readme = "README.md"
authors = [
    { name = "Patrick Kang", email = "kangjian.sz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ib-async>=1.0.3",
    "sqlalchemy>=2.0.30",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "apscheduler>=3.10.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "rich>=13.9.0",
    "python-multipart>=0.0.26",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "freezegun>=1.5.1",
]

[project.scripts]
options-tool = "options_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
